[build-system]
# PEP 639 license expression and license-files, implemented from 77.0.3.
# Under setuptools 61 to 76 the build either fails or writes wrong metadata.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "stabilitygate"
version = "0.1.0"
description = "A three-outcome test-retest stability screen for repeated-call LLM experiments."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Emile Boullineau" },
    { name = "José Daniel Muñoz Arciniegas" },
]
keywords = [
    "large language models",
    "evaluation",
    "test-retest reliability",
    "restriction of range",
    "reproducibility",
    "psychometrics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7.0", "scipy>=1.7"]

[project.urls]
Homepage = "https://judgmentalism.org/stabilitygate/"
Repository = "https://github.com/boullineau/stabilitygate"
Changelog = "https://github.com/boullineau/stabilitygate/blob/main/CHANGELOG.md"

[project.scripts]
stabilitygate = "stabilitygate.__main__:main"

[tool.setuptools.packages.find]
include = ["stabilitygate*"]

[tool.setuptools.package-data]
stabilitygate = ["py.typed", "data/*.csv", "data/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: recomputes rather than reading a reference output. Deselect with -m 'not slow'",
]

[tool.coverage.run]
source = ["stabilitygate"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
